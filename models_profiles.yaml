# Model Profiles — per-family defaults for quality presets
# These are applied when a catalog key matches a profile name.
# The queue resolves: model key -> profile -> profile.defaults merged into request.
# Unsupported models are flagged so submit validation can reject honestly.

profiles:
  # Live-catalog profiles (sd.cpp sdxl engine — no mflux v-pred knobs here).
  - name: "sdxl-pony"
    models:
      - "sdxl-pony"
    defaults:
      score_tags: "score_9, score_8_up, score_7_up"
      negative: "score_6, score_5, score_4, worst quality, low quality, bad anatomy"
      sampler: "euler_a"
      steps: 30

  - name: "sdxl-illustrious"
    models:
      - "sdxl-illustrious"
    defaults:
      positive_prefix: "masterpiece, best quality, "
      negative: "worst quality, low quality, bad anatomy, bad composition"
      sampler: "euler_a"
      steps: 28

  # Family defaults for mflux-sidecar keys (apply when those keys are loaded
  # into models.json on a gateway host carrying the v-pred engines).
  - name: "pony"
    models:
      - "pony-v6"
      - "pony-v6-xl"
    defaults:
      prediction_type: "v"
      cfg_rescale: 0.7
      score_tags: "score_9, score_8_up, score_7_up"
      negative: "score_6, score_5, score_4, worst quality, low quality, bad anatomy"
      sampler: "euler_a"
      steps: 30
    unsupported: []

  - name: "noobai"
    models:
      - "noobai-vpred"
      - "noobai-vpred-xl"
    defaults:
      prediction_type: "v"
      cfg_rescale: 0.5
      positive_prefix: "masterpiece, best quality, "
      negative_prefix: "worst quality, low quality, bad anatomy, "
      sampler: "dpmpp_2m"
      steps: 28

  - name: "illustrious"
    models:
      - "illustrious-xl"
      - "illustrious-v0"
    defaults:
      positive_prefix: "masterpiece, best quality, "
      negative: "worst quality, low quality, bad anatomy, bad composition"
      sampler: "euler_a"
      steps: 28

  - name: "sd15-nsfw"
    models:
      - "juggernaut-xl"
      - "realistic-vision"
      - "dreamshaper"
    defaults:
      sampler: "dpmpp_2m"
      steps: 20
      cfg_scale: 7.0

  - name: "animagine"
    models:
      - "animagine-xl"
      - "animagine-v3"
    defaults:
      positive_prefix: "masterpiece, best quality, very aesthetic, "
      negative: "worst quality, low quality, bad anatomy, watermark, text, signature"
      sampler: "euler_a"
      steps: 28

  - name: "juggernaut"
    models:
      - "juggernaut-xl-v9"
      - "juggernaut-xl-v8"
    defaults:
      sampler: "dpmpp_2m"
      steps: 25
      cfg_scale: 7.0